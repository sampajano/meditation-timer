<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 0 1400 1400" role="img" aria-labelledby="title desc">
  <title id="title">Live Activity notification timer mechanics</title>
  <desc id="desc">Technical diagram explaining that reliable notification seconds come from iOS system date text, while app and ActivityKit updates publish session state only.</desc>
  <defs>
    <marker id="arrow-good" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1f8a70"/>
    </marker>
    <marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#8a7857"/>
    </marker>
    <style>
      .bg { fill: #fffaf0; }
      .panel-soft { fill: #fff4d8; stroke: #c88d28; stroke-width: 2; }
      .panel-good { fill: #ecfff8; stroke: #1f8a70; stroke-width: 2.5; }
      .panel-warn { fill: #fff0e8; stroke: #b4562a; stroke-width: 2.5; }
      .panel-muted { fill: #f7f2e8; stroke: #8a7857; stroke-width: 2; }
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2f2415; }
      .subtitle { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6f5831; }
      .h { font: 700 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2f2415; }
      .h-good { font: 700 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #11654f; }
      .h-warn { font: 700 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #8f3f20; }
      .body { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4d3d24; }
      .small { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #655334; }
      .code { font: 600 16px "SFMono-Regular", Consolas, monospace; fill: #2f2415; }
      .code-good { font: 700 17px "SFMono-Regular", Consolas, monospace; fill: #11654f; }
      .code-warn { font: 700 16px "SFMono-Regular", Consolas, monospace; fill: #8f3f20; }
      .good-line { stroke: #1f8a70; stroke-width: 4; fill: none; marker-end: url(#arrow-good); }
      .muted-line { stroke: #8a7857; stroke-width: 3; fill: none; marker-end: url(#arrow-muted); }
      .divider { stroke: #d8bd7a; stroke-width: 2; stroke-dasharray: 8 8; }
      .badge-good { fill: #1f8a70; }
      .badge-warn { fill: #b4562a; }
      .badge-text { font: 800 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: white; letter-spacing: .5px; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="1400"/>

  <text class="title" x="70" y="64">Consistent Timer Display In Live Activity Notifications</text>
  <text class="subtitle" x="70" y="98">Reliable visible seconds come from iOS system date text. App and ActivityKit updates publish state only.</text>

  <rect class="badge-good" x="70" y="140" width="190" height="34" rx="17"/>
  <text class="badge-text" x="103" y="162">RELIABLE CLOCK PATH</text>

  <rect class="panel-soft" x="70" y="205" width="300" height="215" rx="18"/>
  <text class="h" x="95" y="248">1. App Runtime</text>
  <text class="body" x="95" y="288">Owns the true session model:</text>
  <text class="code" x="95" y="322">isRunning</text>
  <text class="code" x="95" y="350">timeLeft</text>
  <text class="code" x="95" y="378">overtimeActive</text>
  <text class="small" x="95" y="405">Also owns audio and bell playback.</text>

  <rect class="panel-good" x="500" y="205" width="360" height="215" rx="18"/>
  <text class="h-good" x="525" y="248">2. ActivityKit State</text>
  <text class="body" x="525" y="288">Publish stable display inputs:</text>
  <text class="code-good" x="525" y="322">endsAt = sessionEnd</text>
  <text class="code" x="525" y="350">timerMode = countdown</text>
  <text class="code" x="525" y="378">nextBellText = Bell every 1:15</text>
  <text class="small" x="525" y="405">No per-second hidden state churn.</text>

  <rect class="panel-good" x="990" y="205" width="330" height="215" rx="18"/>
  <text class="h-good" x="1015" y="248">3. Widget Expression</text>
  <text class="body" x="1015" y="288">Main timer renders as:</text>
  <text class="code-good" x="1015" y="322">Text(endsAt, style: .timer)</text>
  <text class="small" x="1015" y="364">This system text is the observed</text>
  <text class="small" x="1015" y="390">reliable per-second mover.</text>

  <path class="good-line" d="M370 312 C420 312, 450 312, 500 312"/>
  <path class="good-line" d="M860 312 C905 312, 945 312, 990 312"/>

  <rect class="panel-good" x="250" y="500" width="900" height="190" rx="18"/>
  <text class="h-good" x="285" y="546">Visible Result</text>
  <text class="body" x="285" y="586">The Lock Screen timer can continue through the end boundary without an app-driven redraw:</text>
  <text class="code-good" x="285" y="628">0:03  ->  0:02  ->  0:01  ->  0:00  ->  0:01  ->  0:02 ...</text>
  <text class="small" x="285" y="666">The surrounding phase text or + prefix may refresh later, but user-visible seconds keep moving.</text>

  <line class="divider" x1="70" y1="730" x2="1330" y2="730"/>

  <rect class="panel-muted" x="70" y="770" width="590" height="255" rx="18"/>
  <text class="h" x="100" y="816">Boundary Update At Session End</text>
  <text class="body" x="100" y="852">At the end tick, update app state first:</text>
  <text class="code" x="100" y="884">overtimeActive = true</text>
  <text class="code" x="100" y="912">sessionStartTime = nil</text>
  <text class="code" x="100" y="940">startOvertimeLiveActivity()</text>
  <text class="body" x="100" y="980">Then send urgent state on the same activity:</text>
  <text class="code" x="100" y="1012">phase = Extra time; timerMode = elapsed</text>

  <rect class="panel-warn" x="760" y="770" width="560" height="255" rx="18"/>
  <text class="h-warn" x="790" y="816">Do Not Use As The Rendering Clock</text>
  <text class="code-warn" x="790" y="858">Text("41 sec left")</text>
  <text class="body" x="1035" y="858">static text does not tick</text>
  <text class="code-warn" x="790" y="898">activity.update() every second</text>
  <text class="body" x="1095" y="898">can throttle or backlog</text>
  <text class="code-warn" x="790" y="938">TimelineView + prefix</text>
  <text class="body" x="1030" y="938">did not flip reliably</text>
  <text class="code-warn" x="790" y="978">end + request replacement</text>
  <text class="body" x="1080" y="978">failed with visibility</text>
  <text class="small" x="790" y="1012">ActivityKit may accept updates before the card visibly redraws.</text>

  <path class="muted-line" d="M660 900 C700 900, 720 900, 760 900"/>

  <line class="divider" x1="70" y1="1085" x2="1330" y2="1085"/>

  <rect class="panel-soft" x="70" y="1130" width="610" height="180" rx="18"/>
  <text class="h" x="100" y="1176">Stable Secondary Text</text>
  <text class="body" x="100" y="1216">Use cadence text that does not need second-by-second rollover:</text>
  <text class="code" x="100" y="1250">Bell every 10m    Bell every 1:15</text>
  <text class="small" x="100" y="1286">Avoid a secondary "next bell in ..." countdown on the notification.</text>

  <rect class="panel-soft" x="730" y="1130" width="590" height="180" rx="18"/>
  <text class="h" x="760" y="1176">Plus Sign Rule</text>
  <text class="body" x="760" y="1216">A + prefix may appear after the widget renders overtime state.</text>
  <text class="body" x="760" y="1248">It is not reliable at the exact 0:00 boundary.</text>
  <text class="small" x="760" y="1286">The timer must remain understandable without +.</text>

  <rect class="badge-warn" x="70" y="1340" width="170" height="34" rx="17"/>
  <text class="badge-text" x="99" y="1362">KEY INVARIANT</text>
  <text class="small" x="260" y="1362">User-visible seconds come from iOS system date text; ActivityKit updates only publish transitions and stable labels.</text>
</svg>
